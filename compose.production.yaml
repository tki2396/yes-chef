name: yes-chef

services:
  app:
    image: ${YES_CHEF_IMAGE:?Set YES_CHEF_IMAGE to the published image tag}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      YES_CHEF_DB_PATH: /app/data/yes-chef.sqlite
    expose:
      - "8080"
    volumes:
      - /opt/apps/yes-chef/data:/app/data
    networks:
      proxy:
        aliases:
          - yes-chef
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "process.exit((await fetch('http://127.0.0.1:8080/healthz')).ok ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
